[project]
name = "llm-tool-comparison"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "haystack-ai>=2.9.0",
    "google-ai-haystack>=2.0.0",
    "google-genai>=1.0.0",
    "langfuse>=2.50.0",
    "openinference-instrumentation-haystack>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tool_comparison"]
